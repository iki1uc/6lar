<script>
class SixLar {
  constructor() {
    this.state = ["A", "B", "C"];   // drei Werte
    this.index = 0;                 // Start
  }

  current() {
    return this.state[this.index];
  }

  next() {
    this.index = (this.index + 1) % this.state.length;
    return this.current();
  }

  prev() {
    this.index = (this.index - 1 + this.state.length) % this.state.length;
    return this.current();
  }

  random() {
    this.index = Math.floor(Math.random() * this.state.length);
    return this.current();
  }
}

const engine = new SixLar();

function show(text) {
  document.getElementById("output").textContent = text;
}

document.getElementById("btn1").onclick = () => show(engine.current());
document.getElementById("btn2").onclick = () => show(engine.next());
document.getElementById("btn3").onclick = () => show(engine.prev());
</script>
